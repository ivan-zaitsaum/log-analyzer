[project]
name = "log-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ivan-zaitsaum", email = "tutomik28@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
log-analyzer = "log_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
